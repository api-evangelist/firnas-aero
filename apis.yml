description: Firnas Aero is a Saudi Arabian deep-tech startup building autonomous Drone-in-a-Box (DiaB)
  systems for aerial surveillance, industrial inspection, and environmental assessment. Its turnkey
  platform pairs self-charging, robotic battery-swapping drone stations with cloud-based remote
  management over 5G, Ethernet, or Wi-Fi, and applies machine-learning and deep-learning models for
  anomaly detection, Foreign Object Debris (FOD) detection, hazard identification, and geo-location.
  Based at KRTP HQ in Thuwal, Saudi Arabia, the company serves infrastructure, energy, and security
  clients including Red Sea Global, NEOM, and the Saudi Electricity Company, and is backed by 500 Global.
  It is tracked in the API Evangelist network as a company profile; no public developer API surface was
  found during enrichment.
